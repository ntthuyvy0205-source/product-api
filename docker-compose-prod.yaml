services:
  mongodb:
    image: mongo:8
    container_name: nammongodb-prod

    volumes:
      - mongodb_prod_data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "quit(db.adminCommand('ping').ok ? 0 : 2)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  product-api:
    image: ntthuyvy/product-api:latest
    container_name: product-api-prod

    ports:
      - "3000:3000"

    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/productdb

    depends_on:
      mongodb:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


volumes:
  mongodb_prod_data: