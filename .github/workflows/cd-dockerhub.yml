name: Product API CD Docker Hub

on:
  push:
    branches:
      - main

jobs:

  # =========================
  # JOB 1: CI + PUSH DOCKER HUB
  # =========================
  build-test-push:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 3000
      MONGO_URI: mongodb://localhost:27017/productdb

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Start Product API
        run: |
          npm start &
          sleep 10

      - name: Healthcheck Product API
        run: curl --fail http://localhost:3000/

      - name: Test products endpoint
        run: curl --fail http://localhost:3000/api/products

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.sha }}

  # =========================
  # JOB 2: DEPLOY VỀ MÁY LOCAL
  # =========================
  deploy-local:
    needs: build-test-push
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Pull latest image
        shell: cmd
        run: docker compose -p product-api -f docker-compose-prod.yaml pull

      - name: Deploy to Local Docker Engine
        shell: cmd
        run: docker compose -p product-api -f docker-compose-prod.yaml up -d --wait --wait-timeout 60

      - name: Show containers
        shell: cmd
        run: docker compose -p product-api -f docker-compose-prod.yaml ps

      - name: Verify Product API container
        shell: cmd
        run: docker inspect product-api-prod --format="{{.State.Health.Status}}" | findstr /x healthy

      - name: Verify MongoDB container
        shell: cmd
        run: docker inspect nammongodb-prod --format="{{.State.Health.Status}}" | findstr /x healthy

      - name: Test deployed API
        shell: cmd
        run: curl --fail http://localhost:3000/

      - name: Test deployed products endpoint
        shell: cmd
        run: curl --fail http://localhost:3000/api/products