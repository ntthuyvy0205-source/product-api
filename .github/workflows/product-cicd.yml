name: Product CI CD

on:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URI: mongodb://127.0.0.1:27017/productdb_ci
      PORT: 3000

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CRUD tests
        run: npm run test:prod

      - name: Start Product API
        run: |
          node server.js > server.log 2>&1 &
          echo $! > server.pid

      - name: Check Product API health
        run: |
          for i in {1..20}; do
            if curl --fail http://127.0.0.1:3000/health; then
              exit 0
            fi
            sleep 2
          done

          cat server.log
          exit 1


  docker:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.sha }}


  deploy-local:
    needs: docker
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Pull latest Docker images
        run: docker compose -f docker-compose-prod.yaml pull

      - name: Deploy to local Docker Engine
        run: docker compose -f docker-compose-prod.yaml up -d

      - name: Show running containers
        run: docker compose -f docker-compose-prod.yaml ps

      - name: Check Product API health
        shell: powershell
        run: |
          $success = $false

          for ($i = 1; $i -le 20; $i++) {
            try {
              $response = Invoke-WebRequest `
                -Uri "http://localhost:3000/health" `
                -UseBasicParsing

              if ($response.StatusCode -eq 200) {
                Write-Host "Product API is healthy"
                Write-Host $response.Content
                $success = $true
                break
              }
            }
            catch {
              Write-Host "Waiting for Product API..."
            }

            Start-Sleep -Seconds 3
          }

          if (-not $success) {
            Write-Host "Product API healthcheck failed"
            docker compose -f docker-compose-prod.yaml logs
            exit 1
          }